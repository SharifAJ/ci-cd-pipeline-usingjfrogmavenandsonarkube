name: CI/CD Pipeline with SonarCloud and JFrog

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required by SonarCloud for a full history analysis

    - name: 2. Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: 3. Compile & Analyze with SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mvn -B verify sonar:sonar \
          -Dsonar.projectKey=sharifaj_ci-cd-pipeline-usingjfrogmavenandsonarkube \
          -Dsonar.organization=sharifaj \
          -Dsonar.host.url=https://sonarcloud.io

    - name: 4. Authenticate JFrog CLI
      uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: https://trialu1oldn.jfrog.io/
        JF_USER: ${{ secrets.JFROG_USER }}
        JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}

    - name: 5. Publish to JFrog Artifactory
      run: |
        # Configure JFrog to deploy both releases and snapshots
        jf mvn-config --repo-deploy-releases default-maven-local --repo-deploy-snapshots default-maven-local
        # Execute the Maven deployment via JFrog
        jf mvn clean install -U