name: Centralized Code Scanner (Maven/Sonar/JFrog)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target GitHub Repository (e.g., SharifAJ/SecureDriveUploader)'
        required: true
        type: string
      target_branch:
        description: 'Branch to test (default: main)'
        required: true
        default: 'main'
        type: string

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. Checkout Target Repository
      uses: actions/checkout@v4
      with:
        # This dynamically pulls whichever repo you type into the GitHub UI
        repository: ${{ github.event.inputs.target_repo }}
        ref: ${{ github.event.inputs.target_branch }}
        fetch-depth: 0

    - name: 2. Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: 3. Compile & Analyze with SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mvn -B verify sonar:sonar \
          -Dsonar.projectKey=sharifaj_ci-cd-pipeline-usingjfrogmavenandsonarkube \
          -Dsonar.organization=sharifaj \
          -Dsonar.host.url=https://sonarcloud.io

    - name: 4. Authenticate JFrog CLI
      uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: https://trialu1oldn.jfrog.io/
        JF_USER: ${{ secrets.JFROG_USER }}
        JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}

    - name: 5. Publish to JFrog Artifactory
      run: |
        # Configure JFrog to deploy both releases and snapshots
        jf mvn-config --repo-deploy-releases default-maven-local --repo-deploy-snapshots default-maven-local
        # Execute the Maven deployment via JFrog
        jf mvn clean install -U